<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Xác Nhận Suất Ăn</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <img src="assets/logo.png" alt="Logo quỹ từ thiện" class="logo" onerror="this.style.display='none'" />
      <h1>Xác Nhận Suất Ăn</h1>
      <p class="header-sub">Chương trình Mì Sài Gòn 0đ</p>
    </div>
  </header>

  <main class="container">

    <div id="memberConfirmView" class="card" style="display: none;">
      <div class="info-row">
        <span class="info-label">Ngày giờ</span>
        <span class="info-value" id="confirmDateTime"></span>
      </div>
      <div class="info-row">
        <span class="info-label">Tên khách</span>
        <span class="info-value" id="confirmMemberName"></span>
      </div>
      <div class="info-row">
        <span class="info-label">Còn lại tháng này</span>
        <span class="info-value" id="confirmRemaining"></span>
      </div>

      <div class="form-group" style="margin-top: 24px;">
        <label for="quanPassword">Mật Khẩu Quán Ăn <span class="required">*</span></label>
        <p class="field-hint">Chủ quán tự nhập mật khẩu của quán mình để xác nhận</p>
        <div class="password-field-wrapper">
          <input type="password" id="quanPassword" autocomplete="off" placeholder="Nhập mật khẩu quán" />
          <button type="button" id="togglePasswordBtn" class="password-toggle-btn" aria-label="Hiện mật khẩu">&#128274;</button>
        </div>
        <span class="error-msg" id="passwordError"></span>
      </div>

      <button type="button" id="confirmSubmitBtn" class="btn-submit" disabled>XÁC NHẬN NỘP</button>
    </div>

    <div id="loadErrorView" class="card error-card" style="display: none;">
      <div class="error-icon">&#33;</div>
      <h2>Không Tìm Thấy Thông Tin</h2>
      <p id="loadErrorText"></p>
    </div>

    <div id="resultSuccessView" class="card success-card" style="display: none;">
      <div class="success-icon">&#10004;</div>
      <h2>Đã Ghi Nhận!</h2>
      <p id="resultSuccessText"></p>
    </div>

    <div id="resultErrorView" class="card error-card" style="display: none;">
      <div class="error-icon">&#33;</div>
      <h2>Không Ghi Nhận Được</h2>
      <p id="resultErrorText"></p>
      <button type="button" id="tryAgainBtn" class="btn-secondary">Tải Lại Trang</button>
    </div>

  </main>

  <footer class="footer">
    <p>Chương trình từ thiện Mì Sài Gòn 0đ &copy; 2026</p>
  </footer>

  <script src="quet.js"></script>
</body>
</html>
